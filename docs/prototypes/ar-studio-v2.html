<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR 滤镜工作室</title>
<style>
  :root{
    --bg:#0E0E10; --panel:#17171B; --line:#26262C; --line2:#34343C;
    --fg:#EDEBE6; --muted:#8A8A93; --accent:#C9A0FF; --rec:#FF5A52; --gold:#F0C674;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;
  }
  #stage{position:relative;width:min(100%,900px);aspect-ratio:16/9;background:#000;
         border-radius:14px;overflow:hidden;border:1px solid var(--line);touch-action:none;cursor:grab}
  #stage[data-drag="1"]{cursor:grabbing}
  #gl{display:block;width:100%;height:100%}
  video{display:none}
  #hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);
        font-size:12px;color:rgba(255,255,255,.62);background:rgba(0,0,0,.4);
        padding:5px 12px;border-radius:999px;pointer-events:none;transition:opacity .4s}
  #mask{position:absolute;left:10px;bottom:10px;width:112px;height:63px;border-radius:6px;
        opacity:.85;display:none;image-rendering:pixelated;border:1px solid var(--line)}
  #boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:16px;text-align:center;padding:24px;background:var(--bg);z-index:5}
  #boot p{margin:0;color:var(--muted);font-size:13px;line-height:1.7;max-width:38ch}
  #start{background:var(--accent);color:#1A0F2E;border:0;border-radius:999px;padding:12px 28px;
         font-size:15px;font-weight:500;cursor:pointer}
  #start:disabled{background:var(--line);color:var(--muted);cursor:default}

  #packs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .pack{position:relative;width:86px;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:8px 6px 7px;cursor:pointer;font-family:inherit;color:var(--muted)}
  .pack:hover{border-color:var(--line2);color:var(--fg)}
  .pack[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}
  .pack canvas{display:block;width:100%;height:46px}
  .pack .nm{font-size:12px;text-align:center;margin-top:3px}
  .pack .tag{position:absolute;top:5px;right:5px;font-family:var(--mono);font-size:9px;
             background:var(--gold);color:#2A1D00;border-radius:4px;padding:1px 4px}
  .pack[data-locked="0"] .tag{display:none}

  #bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;
       background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 18px}
  label{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
  input[type=range]{width:96px;accent-color:var(--accent)}
  input[type=checkbox]{accent-color:var(--accent)}
  .val{font-family:var(--mono);font-size:11px;min-width:28px;text-align:right;color:var(--fg)}
  .sep{width:1px;height:24px;background:var(--line)}
  #rec{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--muted);
       border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  #rec:hover{color:var(--fg)}
  #rec .dot{width:9px;height:9px;border-radius:50%;background:var(--rec)}
  #rec[data-on="1"]{color:var(--rec)}
  #rec[data-on="1"] .dot{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.2}}
  @media (prefers-reduced-motion:reduce){#rec[data-on="1"] .dot{animation:none}}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #stat{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}

  #modal{position:fixed;inset:0;background:rgba(8,8,10,.82);display:none;
         align-items:center;justify-content:center;padding:20px;z-index:20}
  #modal[data-open="1"]{display:flex}
  #card{background:var(--panel);border:1px solid var(--line2);border-radius:18px;
        padding:26px 28px;max-width:340px;text-align:center}
  #card h2{margin:0 0 6px;font-size:19px;font-weight:600}
  #card p{margin:0 0 20px;font-size:13px;color:var(--muted);line-height:1.7}
  #card .price{font-family:var(--mono);font-size:26px;color:var(--gold);margin-bottom:18px}
  #buy{background:var(--gold);color:#2A1D00;border:0;border-radius:999px;padding:11px 26px;
       font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
  #later{background:transparent;border:0;color:var(--muted);font-size:13px;margin-top:12px;
         cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <canvas id="mask" width="112" height="63"></canvas>
  <div id="hint">拖动画面里的道具可以挪位置</div>
  <div id="boot">
    <button id="start" disabled>正在加载模型…</button>
    <p>需要摄像头权限，必须用 https:// 或 localhost 打开。</p>
  </div>
</div>

<div id="packs"></div>

<div id="bar">
  <label>流量<input type="range" id="rate" min="100" max="2200" step="50" value="900"><span class="val" id="rateV">900</span></label>
  <label>风<input type="range" id="wind" min="-300" max="300" step="10" value="0"><span class="val" id="windV">0</span></label>
  <label>黏附<input type="range" id="stick" min="0" max="100" step="5" value="60"><span class="val" id="stickV">60</span></label>
  <span class="sep"></span>
  <label><input type="checkbox" id="showMask">看遮罩</label>
  <label><input type="checkbox" id="useMic">录声音</label>
  <button id="rec" data-on="0"><span class="dot"></span>录制</button>
</div>
<div id="stat">未启动</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div id="card">
    <h2 id="mTitle">解锁道具</h2>
    <p id="mDesc"></p>
    <div class="price" id="mPrice"></div>
    <button id="buy">解锁</button>
    <button id="later">再看看</button>
  </div>
</div>

<script type="module">
import * as THREE from "https://esm.sh/three@0.160.0";
import { FilesetResolver, ImageSegmenter } from "https://esm.sh/@mediapipe/tasks-vision@0.10.14";

const video=document.getElementById("cam"), canvas=document.getElementById("gl");
const stage=document.getElementById("stage"), startB=document.getElementById("start");
const boot=document.getElementById("boot"), statEl=document.getElementById("stat");
const maskCv=document.getElementById("mask"), mctx=maskCv.getContext("2d");
const hint=document.getElementById("hint");

/* ============================================================
   模型资源。部署时把这两项换成自建路径，国内才拉得动，也快很多：
     mkdir -p assets/wasm
     npm pack @mediapipe/tasks-vision@0.10.14   # 解开后 wasm/ 整个目录丢进 assets/wasm
     curl -o assets/selfie_segmenter.tflite \
       https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite
   然后改成 wasm:"/assets/wasm", seg:"/assets/selfie_segmenter.tflite"
   ============================================================ */
const ASSETS={
  wasm:"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm",
  seg :"https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite"
};

/* ============================================================
   物质：雪和水不是换颜色，是两套物理
   ============================================================ */
const SUBSTANCE={
  snow:  {grav:-560,  fric:0.45, streak:0,     size:[3,8],    col:[1,1,1],
          splash:0, settle:true,  twinkle:true,  spread:0.9,  speed:[90,220]},
  water: {grav:-1750, fric:0.05, streak:0.040, size:[1.4,3.0],col:[0.60,0.84,1.0],
          splash:3, settle:false, twinkle:false, spread:0.20, speed:[420,620]},
  coffee:{grav:-1480, fric:0.13, streak:0.034, size:[1.8,3.6],col:[0.46,0.27,0.14],
          splash:2, settle:false, twinkle:false, spread:0.12, speed:[340,470]},
};

/* ============================================================
   道具（发射器）。每个道具画在 canvas 上当贴图，零外部素材。
   port 是出口相对道具中心的位置（-0.5~0.5），spread 是横向铺开范围。
   ============================================================ */
function drawCloud(c,w,h){
  const g=c.getContext("2d");
  g.fillStyle="rgba(255,255,255,.92)";
  const blobs=[[.20,.62,.19],[.36,.44,.24],[.55,.42,.26],[.72,.56,.21],[.86,.66,.15],[.46,.68,.24]];
  for(const [x,y,r] of blobs){ g.beginPath(); g.ellipse(x*w,y*h,r*w*0.6,r*h*1.25,0,0,7); g.fill(); }
  g.fillStyle="rgba(190,190,215,.5)";
  g.beginPath(); g.ellipse(.5*w,.80*h,.42*w,.14*h,0,0,7); g.fill();
}
function drawShower(c,w,h){
  const g=c.getContext("2d");
  g.strokeStyle="#B9BCC6"; g.lineWidth=w*0.055; g.lineCap="round";
  g.beginPath(); g.moveTo(w*.14,h*.10); g.lineTo(w*.42,h*.10); g.quadraticCurveTo(w*.60,h*.10,w*.60,h*.34); g.stroke();
  g.fillStyle="#C9CCD6";
  g.beginPath(); g.moveTo(w*.28,h*.62); g.lineTo(w*.92,h*.62); g.lineTo(w*.84,h*.40); g.lineTo(w*.36,h*.40); g.closePath(); g.fill();
  g.fillStyle="#8A8E99";
  g.beginPath(); g.roundRect(w*.26,h*.60,w*.68,h*.10,h*.05); g.fill();
  g.fillStyle="#5A5E68";
  for(let i=0;i<9;i++){ g.beginPath(); g.arc(w*(.32+i*.075),h*.68,w*.014,0,7); g.fill(); }
}
/* 倾倒角。原来是 -0.62（约 -35°），杯口还朝上——那个姿势倒不出水。
   2.15 rad ≈ 123°，杯口朝右下，port 就是杯沿最低那个点，下面的坐标是按这个角度算出来的。 */
const POUR=2.15;
function drawGlass(c,w,h){
  const g=c.getContext("2d");
  g.save(); g.translate(w*.48,h*.46); g.rotate(POUR);
  g.fillStyle="rgba(150,205,255,.42)";
  g.beginPath(); g.moveTo(-w*.16,-h*.26); g.lineTo(w*.16,-h*.26); g.lineTo(w*.12,h*.26); g.lineTo(-w*.12,h*.26); g.closePath(); g.fill();
  g.strokeStyle="rgba(235,248,255,.9)"; g.lineWidth=w*.022; g.stroke();
  g.fillStyle="rgba(120,190,255,.55)";                       // 杯口那汪水，正要出来
  g.beginPath(); g.ellipse(0,-h*.235,w*.155,h*.05,0,0,7); g.fill();
  g.restore();
}
function drawCup(c,w,h){
  const g=c.getContext("2d");
  g.save(); g.translate(w*.48,h*.46); g.rotate(POUR);
  g.strokeStyle="#F2EFE9"; g.lineWidth=w*.045;              // 把手先画，压在杯身下面
  g.beginPath(); g.arc(w*.20,-h*.02,w*.10,-1.2,1.2); g.stroke();
  g.fillStyle="#F2EFE9";
  g.beginPath(); g.roundRect(-w*.17,-h*.24,w*.34,h*.46,[w*.03,w*.03,w*.06,w*.06]); g.fill();
  g.fillStyle="#6B4426";
  g.beginPath(); g.ellipse(0,-h*.23,w*.165,h*.055,0,0,7); g.fill();
  g.restore();
}

/* port 是出口相对道具中心的位置（x 向右，y 向下，单位是道具自身宽/高）；
   band 是出口的横向铺开宽度；tilt 是初速偏离垂直方向的角度（弧度，正=向右）。 */
const EMITTERS={
  cloud: {name:"云朵", sub:"snow",  free:true,  price:null,   w:0.50, aspect:0.42,
          port:{x:0,y:0.30}, band:0.42, tilt:0, draw:drawCloud,
          desc:"从云里落下的雪，会在头顶和肩膀堆起来。"},
  shower:{name:"花洒", sub:"water", free:false, price:"$0.99",w:0.24, aspect:0.60,
          port:{x:0.11,y:0.21}, band:0.55, tilt:0, draw:drawShower,
          desc:"淋浴水流。碰到人会溅开、顺着往下淌，不堆积。"},
  glass: {name:"水杯", sub:"water", free:false, price:"$0.99",w:0.20, aspect:0.85,
          port:{x:0.079,y:0.259}, band:0.05, tilt:0.42, draw:drawGlass,
          desc:"倾倒的水杯，一道细水流。"},
  coffee:{name:"咖啡杯",sub:"coffee",free:false,price:"$1.99",w:0.21, aspect:0.85,
          port:{x:0.059,y:0.258}, band:0.06, tilt:0.38, draw:drawCup,
          desc:"倒出来的咖啡，棕色、稍微稠一点。"},
};

/* ============================================================
   解锁：付费方式还没定，全部收口在这两个函数里。
   接 Stripe 就在 purchase() 里跳 Checkout，回调成功后调 grant()。
   接兑换码就把 purchase() 换成弹输入框 + 后端校验。
   ============================================================ */
const mem={};
const store={
  get(k){ try{return localStorage.getItem(k);}catch(e){return mem[k]??null;} },
  set(k,v){ try{localStorage.setItem(k,v);}catch(e){mem[k]=v;} }
};
function isUnlocked(id){ return EMITTERS[id].free || store.get("unlock:"+id)==="1"; }
function grant(id){ store.set("unlock:"+id,"1"); renderPacks(); }
async function purchase(id){
  // TODO 接支付。现在是本地直接放行，方便你先跑通体验。
  grant(id); return true;
}

/* ============================================================
   占据图
   ============================================================ */
const GW=112,GH=63;
const grid=new Float32Array(GW*GH), raw=new Float32Array(GW*GH), tmp=new Float32Array(GW*GH);
let maskSeen=false;

function ingest(result){
  const m=result.categoryMask;
  if(!m){ result.close?.(); return; }
  const data=m.getAsUint8Array(), mw=m.width, mh=m.height;
  const corners=[data[0],data[mw-1],data[(mh-1)*mw],data[mh*mw-1]].sort((a,b)=>a-b);
  const bgVal=corners[1];
  for(let y=0;y<GH;y++){
    const sy=(y*mh/GH)|0;
    for(let x=0;x<GW;x++) raw[y*GW+x]=(data[sy*mw+((x*mw/GW)|0)]!==bgVal)?1:0;
  }
  m.close?.(); result.close?.(); maskSeen=true;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    let s=0,n=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const yy=y+dy,xx=x+dx;
      if(yy<0||yy>=GH||xx<0||xx>=GW) continue;
      s+=raw[yy*GW+xx]; n++;
    }
    tmp[y*GW+x]=s/n;
  }
  for(let i=0;i<grid.length;i++) grid[i]+=(tmp[i]-grid[i])*0.45;
}
function occAt(wx,wy){
  const u=0.5-wx/W, v=0.5-wy/H;
  if(u<0||u>1||v<0||v>1) return 0;
  const gx=u*(GW-1), gy=v*(GH-1);
  const x0=gx|0,y0=gy|0,x1=Math.min(x0+1,GW-1),y1=Math.min(y0+1,GH-1);
  const fx=gx-x0,fy=gy-y0;
  const a=grid[y0*GW+x0],b=grid[y0*GW+x1],c=grid[y1*GW+x0],d=grid[y1*GW+x1];
  return (a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;
}
function drawMask(){
  const img=mctx.createImageData(GW,GH);
  for(let i=0;i<GW*GH;i++){
    const v=grid[i]*255|0;
    img.data[i*4]=v*.79|0; img.data[i*4+1]=v*.63|0; img.data[i*4+2]=v; img.data[i*4+3]=255;
  }
  mctx.putImageData(img,0,0);
}

/* ============================================================
   场景
   ============================================================ */
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setClearColor(0x000000,1);
const scene=new THREE.Scene();
let W=1280,H=720;
const camera=new THREE.OrthographicCamera(-W/2,W/2,H/2,-H/2,-100,100);

const videoTex=new THREE.VideoTexture(video);
videoTex.colorSpace=THREE.SRGBColorSpace;
const bg=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:videoTex}));
bg.scale.x=-1; bg.position.z=-1; scene.add(bg);

const propMat=new THREE.MeshBasicMaterial({transparent:true,depthWrite:false});
const prop=new THREE.Mesh(new THREE.PlaneGeometry(1,1),propMat);
prop.position.z=1; prop.renderOrder=3; scene.add(prop);   // 必须压在粒子之上，雪才是从云里出来的

let current="cloud";
let emitPos={x:0,y:0.34};              // 归一化屏幕位置，跟着窗口缩放走
const propTex={};
function buildPropTexture(id){
  if(propTex[id]) return propTex[id];
  const c=document.createElement("canvas"); c.width=512; c.height=Math.round(512*EMITTERS[id].aspect);
  EMITTERS[id].draw(c,c.width,c.height);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  propTex[id]=t; return t;
}
function applyProp(){
  const e=EMITTERS[current], s=SUBSTANCE[e.sub];
  propMat.map=buildPropTexture(current); propMat.needsUpdate=true;
  const pw=W*e.w, ph=pw*e.aspect;
  prop.scale.set(pw,ph,1);
  liqMat.uniforms.uCol.value.setRGB(s.col[0],s.col[1],s.col[2]);
  liqMat.uniforms.uGloss.value = e.sub==="coffee" ? 0.28 : 0.85;   // 咖啡不该反白光
  // 雪用加法混合才有颗粒的通透；水加法会变成发光的线，得用普通混合
  dotMat.blending = s.settle ? THREE.AdditiveBlending : THREE.NormalBlending;
  dotMat.needsUpdate=true;
}

function resize(){
  const r=stage.getBoundingClientRect();
  W=Math.max(2,Math.round(r.width)); H=Math.max(2,Math.round(r.height));
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(W,H,false);
  camera.left=-W/2;camera.right=W/2;camera.top=H/2;camera.bottom=-H/2;
  camera.updateProjectionMatrix();
  bg.scale.set(-W,H,1);
  dotMat.uniforms.uDpr.value=renderer.getPixelRatio();
  applyProp();
}
addEventListener("resize",resize);

/* ============================================================
   粒子池：一套数据，两种渲染（圆点 / 拉伸线段）
   ============================================================ */
const MAX=9000;
const px=new Float32Array(MAX), py=new Float32Array(MAX);
const vx=new Float32Array(MAX), vy=new Float32Array(MAX);
const life=new Float32Array(MAX), born=new Float32Array(MAX);
const siz=new Float32Array(MAX), phase=new Float32Array(MAX);
const cr=new Float32Array(MAX), cg=new Float32Array(MAX), cb=new Float32Array(MAX);
const streak=new Float32Array(MAX);
const settled=new Uint8Array(MAX), isSplash=new Uint8Array(MAX);
let cursor=0;

const dotPos=new Float32Array(MAX*3), dotCol=new Float32Array(MAX*3);
const dotSiz=new Float32Array(MAX), dotAlp=new Float32Array(MAX);
const dotGeo=new THREE.BufferGeometry();
dotGeo.setAttribute("position",new THREE.BufferAttribute(dotPos,3));
dotGeo.setAttribute("pcolor",new THREE.BufferAttribute(dotCol,3));
dotGeo.setAttribute("psize",new THREE.BufferAttribute(dotSiz,1));
dotGeo.setAttribute("palpha",new THREE.BufferAttribute(dotAlp,1));
// gl_PointSize 的单位是设备像素。不乘 dpr 的话，2x 屏上雪花直接小一半。
const dotMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uDpr:{value:1}},
  vertexShader:`uniform float uDpr;
    attribute vec3 pcolor;attribute float psize;attribute float palpha;
    varying vec3 vC;varying float vA;
    void main(){vC=pcolor;vA=palpha;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);gl_PointSize=psize*uDpr;}`,
  fragmentShader:`varying vec3 vC;varying float vA;
    void main(){float d=length(gl_PointCoord-0.5);if(d>0.5)discard;
      gl_FragColor=vec4(vC,smoothstep(0.5,0.0,d)*vA);}`
});
const dots=new THREE.Points(dotGeo,dotMat);
dots.frustumCulled=false; dots.renderOrder=2; scene.add(dots);

/* 液体：沿速度方向拉伸的胶囊，instanced quad。
   不用 LineSegments —— WebGL 的 lineWidth 恒等于 1 设备像素，
   高分屏上是半个 CSS 像素的头发丝，多细的水流都调不出来。
   胶囊有真实宽度、软边和高光核，才有点水的折射感。 */
const liqPos=new Float32Array(MAX*2), liqDir=new Float32Array(MAX*2);
const liqLen=new Float32Array(MAX), liqRad=new Float32Array(MAX), liqAlp=new Float32Array(MAX);
const quad=new THREE.PlaneGeometry(1,1);
const liqGeo=new THREE.InstancedBufferGeometry();
liqGeo.index=quad.index;
liqGeo.attributes.position=quad.attributes.position;
const liqAttr={};
for(const [k,arr,n] of [["iPos",liqPos,2],["iDir",liqDir,2],["iLen",liqLen,1],
                        ["iRad",liqRad,1],["iAlp",liqAlp,1]]){
  const a=new THREE.InstancedBufferAttribute(arr,n);
  a.setUsage(THREE.DynamicDrawUsage); liqGeo.setAttribute(k,a); liqAttr[k]=a;
}
liqGeo.instanceCount=MAX;
const liqMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,depthTest:false,side:THREE.DoubleSide,
  blending:THREE.NormalBlending,
  uniforms:{uCol:{value:new THREE.Color(0.60,0.84,1.0)},uGloss:{value:0.85}},
  vertexShader:`
    attribute vec2 iPos;attribute vec2 iDir;attribute float iLen;
    attribute float iRad;attribute float iAlp;
    varying float vA;varying vec2 vP;varying float vLen;varying float vRad;
    void main(){
      vA=iAlp; vLen=iLen; vRad=iRad;
      vec2 loc=vec2(position.x*2.0*(iLen+iRad), position.y*2.0*iRad);
      vP=loc;
      vec2 r=iDir, u=vec2(-iDir.y,iDir.x);
      vec2 w=iPos+r*loc.x+u*loc.y;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(w,0.0,1.0);
    }`,
  fragmentShader:`
    uniform vec3 uCol;uniform float uGloss;
    varying float vA;varying vec2 vP;varying float vLen;varying float vRad;
    void main(){
      if(vA<0.004||vRad<=0.0) discard;
      float d=length(vec2(max(abs(vP.x)-vLen,0.0), vP.y));   // 胶囊距离场
      if(d>vRad) discard;
      float a=smoothstep(vRad,vRad*0.15,d);
      float k=pow(1.0-d/vRad,3.0);                            // 亮核，当高光
      gl_FragColor=vec4(mix(uCol,vec3(1.0),k*uGloss), a*vA);
    }`
});
const liquid=new THREE.Mesh(liqGeo,liqMat);
liquid.frustumCulled=false; liquid.renderOrder=2; scene.add(liquid);

function alloc(){ const i=cursor; cursor=(cursor+1)%MAX; return i; }

function spawnMain(){
  const e=EMITTERS[current], s=SUBSTANCE[e.sub];
  const pw=W*e.w, ph=pw*e.aspect;
  const ox=emitPos.x*W + e.port.x*pw;
  const oy=emitPos.y*H - e.port.y*ph;
  const i=alloc();
  px[i]=ox+(Math.random()-0.5)*e.band*pw;
  py[i]=oy+(Math.random()-0.5)*8;
  const sp=s.speed[0]+Math.random()*(s.speed[1]-s.speed[0]);
  const ang=(e.tilt||0)+(Math.random()-0.5)*s.spread;   // 杯口朝右下，水就该往右下走
  vx[i]=Math.sin(ang)*sp; vy[i]=-Math.cos(ang)*sp;
  siz[i]=s.size[0]+Math.random()*(s.size[1]-s.size[0]);
  cr[i]=s.col[0];cg[i]=s.col[1];cb[i]=s.col[2];
  streak[i]=s.streak; phase[i]=Math.random()*7;
  life[i]=born[i]=9; settled[i]=0; isSplash[i]=0;
}
function spawnSplash(x,y,nx,ny,s){
  for(let k=0;k<s.splash;k++){
    const i=alloc();
    const a=Math.atan2(ny,nx)+(Math.random()-0.5)*1.5;
    const sp=80+Math.random()*220;
    px[i]=x; py[i]=y; vx[i]=Math.cos(a)*sp; vy[i]=Math.sin(a)*sp+60;
    siz[i]=1.6+Math.random()*2.2;
    cr[i]=s.col[0];cg[i]=s.col[1];cb[i]=s.col[2];
    streak[i]=0; phase[i]=0;
    life[i]=born[i]=0.35+Math.random()*0.3; settled[i]=0; isSplash[i]=1;
  }
}

const E=10;
function step(dt,t,windV,stickMul){
  const s=SUBSTANCE[EMITTERS[current].sub];
  const fric=Math.min(0.98, s.fric*stickMul);
  for(let i=0;i<MAX;i++){
    if(life[i]<=0){ dotAlp[i]=0; dotSiz[i]=0; liqRad[i]=0; liqAlp[i]=0; continue; }
    life[i]-=dt;
    if(life[i]<=0){ dotAlp[i]=0; dotSiz[i]=0; liqRad[i]=0; liqAlp[i]=0; continue; }

    vy[i]+=s.grav*dt;
    vx[i]+=(windV-vx[i])*0.6*dt;
    let nx_=px[i]+vx[i]*dt, ny_=py[i]+vy[i]*dt;

    if(maskSeen && !isSplash[i] && occAt(nx_,ny_)>0.5){
      let nx=occAt(nx_-E,ny_)-occAt(nx_+E,ny_);
      let ny=occAt(nx_,ny_-E)-occAt(nx_,ny_+E);
      const L=Math.hypot(nx,ny);
      if(L<1e-4){nx=0;ny=1;} else {nx/=L;ny/=L;}
      nx_+=nx*7; ny_+=ny*7;
      const vn=vx[i]*nx+vy[i]*ny;
      const impact=Math.hypot(vx[i],vy[i]);
      vx[i]-=vn*nx; vy[i]-=vn*ny;
      vx[i]*=(1-fric); vy[i]*=(1-fric);
      if(!settled[i]){
        settled[i]=1;
        if(s.settle) life[i]=Math.min(life[i],1.4+Math.random()*1.6);
        if(s.splash && impact>260) spawnSplash(nx_,ny_,nx,ny,s);
      }
    }
    px[i]=nx_; py[i]=ny_;
    if(ny_<-H/2-30||Math.abs(nx_)>W){ life[i]=0; continue; }

    const fade=Math.min(1,life[i]/(settled[i]&&s.settle?1.2:0.9));
    const a=s.twinkle? fade*(0.55+0.45*Math.sin(t*7+phase[i])) : fade;

    if(streak[i]>0 && !isSplash[i]){
      dotSiz[i]=0; dotAlp[i]=0;
      const sp=Math.hypot(vx[i],vy[i]);
      liqPos[i*2]=nx_; liqPos[i*2+1]=ny_;
      if(sp>1){ liqDir[i*2]=vx[i]/sp; liqDir[i*2+1]=vy[i]/sp; }
      else    { liqDir[i*2]=1;        liqDir[i*2+1]=0; }
      liqLen[i]=Math.min(sp*streak[i],70)*0.5;   // 半长；停下来自然收成圆水珠
      liqRad[i]=siz[i]; liqAlp[i]=a;
    }else{
      dotPos[i*3]=nx_;dotPos[i*3+1]=ny_;dotPos[i*3+2]=0;
      dotCol[i*3]=cr[i];dotCol[i*3+1]=cg[i];dotCol[i*3+2]=cb[i];
      dotSiz[i]=siz[i]; dotAlp[i]=a;
      liqRad[i]=0; liqAlp[i]=0;
    }
  }
  dotGeo.attributes.position.needsUpdate=true; dotGeo.attributes.pcolor.needsUpdate=true;
  dotGeo.attributes.psize.needsUpdate=true;    dotGeo.attributes.palpha.needsUpdate=true;
  for(const k in liqAttr) liqAttr[k].needsUpdate=true;
}

/* ============================================================
   道具选择 UI
   ============================================================ */
const packsEl=document.getElementById("packs");
function renderPacks(){
  packsEl.innerHTML="";
  for(const [id,e] of Object.entries(EMITTERS)){
    const b=document.createElement("button");
    b.className="pack"; b.setAttribute("aria-pressed",String(id===current));
    b.dataset.locked = isUnlocked(id) ? "0" : "1";
    const c=document.createElement("canvas");
    c.width=172; c.height=92;
    const g=c.getContext("2d");
    const iw=140, ih=Math.round(140*e.aspect);
    const off=document.createElement("canvas"); off.width=iw; off.height=ih;
    e.draw(off,iw,ih);
    g.drawImage(off,(172-iw)/2,(92-ih)/2);
    if(!isUnlocked(id)) c.style.opacity=.42;
    b.appendChild(c);
    const nm=document.createElement("div"); nm.className="nm"; nm.textContent=e.name; b.appendChild(nm);
    const tag=document.createElement("span"); tag.className="tag"; tag.textContent=e.price||""; b.appendChild(tag);
    b.addEventListener("click",()=>select(id));
    packsEl.appendChild(b);
  }
}
const modal=document.getElementById("modal");
let pendingId=null;
function select(id){
  if(!isUnlocked(id)){
    pendingId=id;
    document.getElementById("mTitle").textContent="解锁「"+EMITTERS[id].name+"」";
    document.getElementById("mDesc").textContent=EMITTERS[id].desc;
    document.getElementById("mPrice").textContent=EMITTERS[id].price;
    modal.dataset.open="1";
    return;
  }
  current=id;
  for(let i=0;i<MAX;i++) life[i]=0;
  applyProp(); renderPacks();
}
document.getElementById("buy").addEventListener("click",async()=>{
  const id=pendingId; modal.dataset.open="0";
  if(await purchase(id)) select(id);
});
document.getElementById("later").addEventListener("click",()=>modal.dataset.open="0");

/* ============================================================
   拖动道具
   ============================================================ */
let dragging=false, grab={x:0,y:0};
function toNorm(ev){
  const r=stage.getBoundingClientRect();
  return { x:(ev.clientX-r.left)/r.width-0.5, y:0.5-(ev.clientY-r.top)/r.height };
}
stage.addEventListener("pointerdown",ev=>{
  if(boot.style.display!=="none") return;
  const p=toNorm(ev);
  dragging=true; stage.dataset.drag="1"; stage.setPointerCapture(ev.pointerId);
  grab={x:p.x-emitPos.x, y:p.y-emitPos.y};
  hint.style.opacity="0";
});
stage.addEventListener("pointermove",ev=>{
  if(!dragging) return;
  const p=toNorm(ev);
  emitPos.x=Math.max(-.48,Math.min(.48,p.x-grab.x));
  emitPos.y=Math.max(-.30,Math.min(.48,p.y-grab.y));
});
["pointerup","pointercancel"].forEach(t=>stage.addEventListener(t,()=>{dragging=false;stage.dataset.drag="0";}));

/* ============================================================
   模型 + 摄像头
   ============================================================ */
let segmenter=null;
async function initModel(){
  const fs=await FilesetResolver.forVisionTasks(ASSETS.wasm);
  segmenter=await ImageSegmenter.createFromOptions(fs,{
    baseOptions:{modelAssetPath:ASSETS.seg,delegate:"GPU"},
    runningMode:"VIDEO", outputCategoryMask:true, outputConfidenceMasks:false});
  startB.disabled=false; startB.textContent="开启摄像头";
}
function runSeg(ts){
  let got=false; const cb=r=>{got=true;ingest(r);};
  let ret;
  try{ ret=segmenter.segmentForVideo(video,ts,cb); }
  catch(e){ ret=segmenter.segmentForVideo(video,ts); }
  if(!got&&ret) ingest(ret);
}
async function start(){
  startB.disabled=true; startB.textContent="连接中…";
  try{
    video.srcObject=await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:1280},height:{ideal:720},facingMode:"user"},audio:false});
    await video.play();
    boot.style.display="none"; resize();
    setTimeout(()=>hint.style.opacity="0",5000);
    requestAnimationFrame(loop);
  }catch(e){
    startB.disabled=false; startB.textContent="重试";
    statEl.textContent="摄像头打不开："+e.name;
  }
}
startB.addEventListener("click",start);

/* ============================================================
   循环
   ============================================================ */
const rateEl=document.getElementById("rate"), windEl=document.getElementById("wind"),
      stickEl=document.getElementById("stick"), showMask=document.getElementById("showMask");
[["rate","rateV"],["wind","windV"],["stick","stickV"]].forEach(([a,b])=>{
  const el=document.getElementById(a),out=document.getElementById(b);
  out.textContent=el.value; el.addEventListener("input",()=>out.textContent=el.value);
});
showMask.addEventListener("change",()=>maskCv.style.display=showMask.checked?"block":"none");

let lastT=0,lastVT=-1,acc=0,fpsA=0,fpsN=0,fps=0;
function loop(now){
  requestAnimationFrame(loop);
  const t=now/1000, dt=Math.min(lastT?t-lastT:0.016,0.05); lastT=t;
  if(dt<=0) return;
  if(segmenter&&video.currentTime!==lastVT){ lastVT=video.currentTime; runSeg(now); }

  prop.position.set(emitPos.x*W, emitPos.y*H, 1);

  acc+=Number(rateEl.value)*dt;
  const n=Math.min(acc|0,400); acc-=n;
  for(let i=0;i<n;i++) spawnMain();

  step(dt,t,Number(windEl.value),0.4+Number(stickEl.value)/100*1.6);
  renderer.render(scene,camera);
  if(showMask.checked) drawMask();

  fpsA+=1/dt; fpsN++;
  if(fpsN>=20){ fps=Math.round(fpsA/fpsN); fpsA=0; fpsN=0; }
  statEl.textContent=`${maskSeen?"已锁定人像":"等待分割"} · ${fps} fps`;
}

/* ============================================================
   录制（可选带麦克风）
   ============================================================ */
const recBtn=document.getElementById("rec"), useMic=document.getElementById("useMic");
let micStream=null,recorder=null,chunks=[];
useMic.addEventListener("change",async()=>{
  if(!useMic.checked){ micStream?.getTracks().forEach(t=>t.stop()); micStream=null; return; }
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ useMic.checked=false; statEl.textContent="麦克风被拒绝了"; }
});
/* 抖音 / Reels 都收不了 webm，iPhone 本地也打不开。
   mp4 排在前面，拿不到才退回 webm。浏览器不同结果不同，
   所以把实际选中的容器写在按钮上，你换台机器一眼能看见录出来的是什么。 */
const PREFER=[
  "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
  "video/mp4;codecs=avc1",
  "video/mp4",
  "video/webm;codecs=vp9,opus",
  "video/webm;codecs=vp8,opus",
  "video/webm"
];
const RECTYPE=PREFER.find(t=>MediaRecorder.isTypeSupported?.(t))||"";
const RECEXT=RECTYPE.includes("mp4")?"mp4":"webm";
recBtn.lastChild.textContent=`录制 · ${RECEXT.toUpperCase()}`;

recBtn.addEventListener("click",()=>{
  if(recorder){ recorder.stop(); return; }
  const out=canvas.captureStream(30);
  if(micStream) micStream.getAudioTracks().forEach(tr=>out.addTrack(tr));
  const opt={videoBitsPerSecond:8e6,audioBitsPerSecond:128e3};
  if(RECTYPE) opt.mimeType=RECTYPE;
  try{ recorder=new MediaRecorder(out,opt); }
  catch(e){ recorder=new MediaRecorder(out); }          // 参数不被接受就交给浏览器默认
  chunks=[];
  recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  recorder.onstop=()=>{
    const mt=recorder.mimeType||RECTYPE||"video/webm";
    const ext=mt.includes("mp4")?"mp4":"webm";
    const url=URL.createObjectURL(new Blob(chunks,{type:mt.split(";")[0]}));
    const a=document.createElement("a"); a.href=url; a.download=`ar-${current}-${Date.now()}.${ext}`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    recorder=null; recBtn.dataset.on="0"; recBtn.lastChild.textContent=`录制 · ${ext.toUpperCase()}`;
  };
  recorder.start(); recBtn.dataset.on="1"; recBtn.lastChild.textContent="停止并下载";
});

renderPacks(); resize();
initModel().catch(e=>{ startB.textContent="模型加载失败"; statEl.textContent=String(e.message||e); });
</script>
